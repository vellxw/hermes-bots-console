name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio fastapi httpx python-multipart
      - name: Verify public distribution
        run: npm run verify
      - name: Verify reproducible bundles
        run: npm run build
      - name: Package deterministic release archive
        run: npm run pack
      - name: Run JavaScript tests
        run: npm test
      - name: Run Python tests
        run: python -m pytest -q
