name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio fastapi httpx python-multipart
      - name: Build updated frontend and capture SRI
        run: npm run build
      - name: Verify committed distribution integrity
        run: npm run verify
      - name: Verify published-tag catalog integrity
        run: npm run verify:catalog
      - name: Package deterministic release archive
        run: npm run pack
      - name: Run JavaScript tests
        run: npm test
      - name: Run Python tests
        run: python -m pytest -q
      - name: Attach candidate archive (CI artifact, not a GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bots-console-${{ matrix.os }}
          path: dist/hermes-bots-console-0.5.0-rc.1.tar.gz
          if-no-files-found: error

  browser-fixture:
    name: Chromium fixture smoke (not authenticated Hermes)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated browser test dependencies
        run: npm install --no-save --no-package-lock react@18.3.1 react-dom@18.3.1 playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser against SDK fixture
        run: node scripts/browser-smoke.mjs
      - name: Upload fixture screenshots (not a product demo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-screenshots
          path: dist/browser-smoke-*.png
          if-no-files-found: ignore
