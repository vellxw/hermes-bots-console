name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio fastapi httpx python-multipart
      - name: Rebuild source bundles (temporarily refresh working-tree SRI)
        run: npm run build
      - name: Verify committed distribution integrity
        run: npm run verify
      - name: Verify pinned catalog release
        run: npm run verify:catalog
      - name: Package deterministic release archive
        run: npm run pack
      - name: Run JavaScript tests
        run: npm test
      - name: Run Python tests
        run: python -m pytest -q
      - name: Attach candidate archive (CI artifact, not a GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bots-console-${{ matrix.os }}
          path: dist/hermes-bots-console-0.5.0-rc.1.tar.gz
          if-no-files-found: error
