<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Bot Command — Desktop 3-Pane Workspace</title>
  <desc id="desc">Animated demo showing the rail, chat, and live Bot Screen inspector</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)" rx="12"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="900" height="40" fill="#161b22" rx="12"/>
  <rect x="0" y="28" width="900" height="12" fill="#161b22"/>
  <text x="20" y="26" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Hermes Dashboard</text>
  <rect x="160" y="10" width="60" height="20" rx="4" fill="#21262d"/>
  <text x="190" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#8b949e">Bots</text>
  <rect x="230" y="10" width="60" height="20" rx="4" fill="#1f6feb"/>
  <text x="260" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fff">Chat</text>

  <!-- Rail -->
  <rect x="0" y="40" width="200" height="480" fill="#0d1117"/>
  <rect x="0" y="40" width="1" height="480" fill="#30363d"/>
  <text x="16" y="68" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1">BOTS</text>

  <!-- Bot cards -->
  <g>
    <rect x="8" y="80" width="184" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="32" cy="106" r="14" fill="#58a6ff"/>
    <text x="32" y="110" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">A</text>
    <text x="56" y="100" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Analyst</text>
    <text x="56" y="116" font-family="Inter,sans-serif" font-size="10" fill="#8b949e">online · planning</text>
    <circle cx="178" cy="94" r="4" fill="#3fb950"/>
  </g>
  <g>
    <rect x="8" y="140" width="184" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="32" cy="166" r="14" fill="#bc8cff"/>
    <text x="32" y="170" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">C</text>
    <text x="56" y="160" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Chief</text>
    <text x="56" y="176" font-family="Inter,sans-serif" font-size="10" fill="#8b949e">online · autonomous</text>
    <circle cx="178" cy="154" r="4" fill="#3fb950"/>
  </g>
  <g>
    <rect x="8" y="200" width="184" height="52" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="32" cy="226" r="14" fill="#f78166"/>
    <text x="32" y="230" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">R</text>
    <text x="56" y="220" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Researcher</text>
    <text x="56" y="236" font-family="Inter,sans-serif" font-size="10" fill="#8b949e">selected · live</text>
    <circle cx="178" cy="214" r="4" fill="#3fb950"/>
  </g>

  <!-- Chat area -->
  <rect x="200" y="40" width="420" height="480" fill="#0d1117"/>
  <rect x="200" y="40" width="1" height="480" fill="#30363d"/>

  <!-- Chat messages -->
  <g font-family="Inter,sans-serif">
    <text x="220" y="72" font-size="11" fill="#8b949e">Researcher</text>
    <rect x="220" y="80" width="260" height="36" rx="8" fill="#161b22"/>
    <text x="232" y="102" font-size="12" fill="#e6edf3">Analyzing the dataset now...</text>

    <text x="220" y="136" font-size="11" fill="#8b949e">You</text>
    <rect x="360" y="144" width="240" height="36" rx="8" fill="#1f6feb"/>
    <text x="372" y="166" font-size="12" fill="#fff">Show me the results</text>

    <text x="220" y="200" font-size="11" fill="#8b949e">Researcher</text>
    <rect x="220" y="208" width="340" height="56" rx="8" fill="#161b22"/>
    <text x="232" y="230" font-size="12" fill="#e6edf3">Found 3 anomalies in the data.</text>
    <text x="232" y="250" font-size="12" fill="#e6edf3">Generating report...</text>
  </g>

  <!-- Typing indicator -->
  <g>
    <circle cx="232" cy="290" r="3" fill="#8b949e">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="244" cy="290" r="3" fill="#8b949e">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="290" r="3" fill="#8b949e">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Composer -->
  <rect x="210" y="470" width="400" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="224" y="493" font-family="Inter,sans-serif" font-size="12" fill="#484f58">Type a message...</text>

  <!-- Inspector -->
  <rect x="620" y="40" width="280" height="480" fill="#0d1117"/>
  <rect x="620" y="40" width="1" height="480" fill="#30363d"/>
  <text x="636" y="68" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1">INSPECTOR</text>

  <!-- Live screen card -->
  <rect x="630" y="80" width="260" height="180" rx="8" fill="#000" stroke="#30363d" stroke-width="1"/>
  <text x="760" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#3fb950" font-weight="600">● LIVE</text>

  <!-- Animated screen content -->
  <g>
    <rect x="640" y="110" width="240" height="140" rx="4" fill="#1a1a2e"/>
    <!-- Desktop window -->
    <rect x="650" y="120" width="120" height="80" rx="4" fill="#2d2d44" stroke="#58a6ff" stroke-width="1"/>
    <rect x="650" y="120" width="120" height="16" rx="4" fill="#58a6ff" opacity="0.3"/>
    <text x="660" y="132" font-family="monospace" font-size="8" fill="#e6edf3">Terminal</text>
    <!-- Cursor blink -->
    <rect x="658" y="148" width="6" height="10" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- Another window -->
    <rect x="780" y="130" width="90" height="60" rx="4" fill="#2d2d44" stroke="#bc8cff" stroke-width="1"/>
    <rect x="780" y="130" width="90" height="14" rx="4" fill="#bc8cff" opacity="0.3"/>
    <text x="790" y="140" font-family="monospace" font-size="8" fill="#e6edf3">Browser</text>
  </g>

  <!-- View only badge -->
  <rect x="630" y="268" width="80" height="22" rx="4" fill="#21262d"/>
  <text x="670" y="283" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8b949e">View only</text>

  <!-- Take control button -->
  <rect x="720" y="268" width="100" height="22" rx="4" fill="#1f6feb"/>
  <text x="770" y="283" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fff" font-weight="600">Take control</text>

  <!-- Bot info -->
  <text x="636" y="310" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Researcher</text>
  <text x="636" y="328" font-family="Inter,sans-serif" font-size="10" fill="#8b949e">Profile: researcher · DISPLAY :22</text>
  <text x="636" y="346" font-family="Inter,sans-serif" font-size="10" fill="#8b949e">Lease: agent · Memory: 2.1 GB free</text>

  <!-- Turbo badge -->
  <rect x="630" y="360" width="90" height="22" rx="4" fill="#238636" opacity="0.8"/>
  <text x="675" y="375" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fff" font-weight="600">Turbo: Auto</text>

  <!-- Mobile preview (bottom right) -->
  <rect x="730" y="360" width="150" height="140" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="805" y="380" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#8b949e">MOBILE</text>
  <rect x="740" y="390" width="130" height="100" rx="6" fill="#000"/>
  <rect x="745" y="395" width="120" height="90" rx="4" fill="#1a1a2e"/>
  <text x="805" y="445" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#3fb950">● fullscreen</text>

  <!-- Footer -->
  <rect x="0" y="500" width="900" height="20" fill="#161b22"/>
  <text x="450" y="514" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#484f58">Hermes Bot Command · v0.5.0-rc.1 · MIT License</text>
</svg>
READMEEOF
echo "SVG created"