<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Bot Command architecture</title>
  <desc id="desc">Dashboard clients connect to Hermes Gateway, which loads the Bot Command plugin and profile-scoped storage.</desc>
  <rect width="1100" height="440" fill="#f5f7fa"/>
  <g font-family="Inter,Arial,sans-serif" fill="#17202a">
    <text x="550" y="42" text-anchor="middle" font-size="24" font-weight="700">Hermes Bot Command</text>
    <text x="550" y="70" text-anchor="middle" font-size="14" fill="#536273">Dashboard extension, not a Hermes core fork</text>
    <g stroke="#506174" stroke-width="2" fill="#fff">
      <rect x="55" y="130" width="230" height="150" rx="16"/>
      <rect x="435" y="115" width="230" height="180" rx="16" fill="#eaf2ff"/>
      <rect x="815" y="130" width="230" height="150" rx="16"/>
    </g>
    <g font-size="17" text-anchor="middle" font-weight="700">
      <text x="170" y="168">Dashboard</text>
      <text x="550" y="153">Hermes Gateway</text>
      <text x="930" y="168">Profile storage</text>
    </g>
    <g font-size="13" text-anchor="middle" fill="#536273">
      <text x="170" y="198">Roster and chat</text><text x="170" y="220">Native groups</text><text x="170" y="242">Turbo decisions</text>
      <text x="550" y="185">Public RPC surfaces</text><text x="550" y="207">Authentication</text><text x="550" y="229">Profile isolation</text><text x="550" y="251">Optional Linux Bot Desktop</text>
      <text x="930" y="198">groups.json</text><text x="930" y="220">&lt;profile&gt;.json</text><text x="930" y="242">Temporary attachments</text>
    </g>
    <g stroke="#2f6fed" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M285 205h145"/><path d="M665 205h145"/>
    </g>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fed"/></marker></defs>
</svg>
