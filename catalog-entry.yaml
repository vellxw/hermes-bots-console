schema_version: 1
name: hermes-bots-console
label: Hermes Bot Command
version: 0.5.0-rc.1
source:
  type: git
  url: https://github.com/vellxw/hermes-bots-console
  ref: v0.5.0-rc.1
  # The Git-tag source does not currently publish a corresponding archive asset.
  # Add sha256_asset only after attaching and hashing a reproducible release archive.
requires_hermes: ">=0.21.6"
platforms:
  client: [linux, macos, windows]
  gateway: [linux, macos, windows]
capabilities:
  - dashboard_roster
  - bot_chat
  - native_groups
  - profile_scoped_turbo
  - attachments_and_voice_adapters
  - isolated_desktop_viewer_linux_gateway_only
known_issues:
  - The isolated desktop viewer requires a Linux gateway with Hermes Bot Desktop dependencies.
  - Client OS support is separate from gateway OS support; Windows and macOS clients can use a remote Linux gateway.
  - Repository: https://github.com/vellxw/hermes-bots-console
integrity:
  manifest: dashboard/manifest.json
  entry_sri: sha384-10hYRbvlNeg028KgRJmYdEM3AaxJGkrsXR40Au90o1TXROLn4TDWrFu+7rQB+Vxq
